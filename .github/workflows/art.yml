name: Refresh art

on:
  schedule:
    - cron: "7 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: art
  cancel-in-progress: false

jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The contribution chart lives on the art branch so main keeps only
      # hand-made history. The README points at the files there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: art
          path: out

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Fetch contributions
        run: python3 art/fetch_contrib.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build art
        run: python3 art/build.py

      - name: Commit to art branch if changed
        working-directory: out
        run: |
          cp ../art/contrib.json ../art/contrib-runner-mono-dark.svg ../art/contrib-runner-mono-light.svg .
          if [ -z "$(git status --porcelain)" ]; then
            echo "No art changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib.json contrib-runner-mono-dark.svg contrib-runner-mono-light.svg
          git commit -m "Refresh contribution art"
          git push
